<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-NZBN72XX');</script>
  <!-- End Google Tag Manager -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - GERP</title>
  <meta name="robots" content="noindex,follow">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GERP">
  <meta property="og:title" content="{{ title }} — GERP">
  <meta property="og:description" content="GERP — Generative Engine Results Page.">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:image:width" content="1158">
  <meta property="og:image:height" content="596">
  <meta property="og:image:alt" content="GERP — Generative Engine Results Page">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ og_image }}">

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Google+Sans:400,500&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 140px 16px 0;
      text-align: center;
    }
    .logo {
      font-family: 'Google Sans', Arial, sans-serif;
      font-size: 52px;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 28px;
      text-decoration: none;
    }
    .logo span:nth-child(1) { color: #4285F4; }
    .logo span:nth-child(2) { color: #EA4335; }
    .logo span:nth-child(3) { color: #FBBC05; }
    .logo span:nth-child(4) { color: #4285F4; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 10px; }
    .detail {
      color: #5f6368;
      font-size: 14px;
      max-width: 440px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #4285F4;
      border: 1px solid #4285F4;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      padding: 9px 22px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { background: #3367d6; border-color: #3367d6; }
    .key-form { margin-bottom: 24px; }
    .key-form input[type=password] {
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
      padding: 9px 12px;
      width: 240px;
      margin-right: 8px;
    }
    .key-form input[type=password]:focus { outline: none; border-color: #4285F4; }
    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      border-top: 1px solid #ebebeb;
      background: #f2f2f2;
      padding: 10px 24px;
      font-size: 13px;
      color: #767676;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NZBN72XX"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <a class="logo" href="/"><span>G</span><span>E</span><span>R</span><span>P</span></a>
  <h1>{{ title }}</h1>
  <div class="detail">{{ detail }}</div>

  {% if show_key_form %}
  <form class="key-form" action="/" method="get">
    <input type="password" name="key" placeholder="Access key" autofocus>
    <button type="submit" class="btn">Enter</button>
  </form>
  {% else %}
  <a class="btn" href="/">Back to GERP search</a>
  {% endif %}

  <div class="footer">&copy; 2026 Topical Gravity LLC</div>
</body>
</html>
