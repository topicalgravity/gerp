services:
  - type: web
    name: gerp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Shared secret: requests need ?key=<value> once (then cookied).
      # Without this, anyone who finds the URL spends your API credits.
      - key: GERP_PASSWORD
        sync: false
