services:
  - type: web
    name: gerp
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Web-search runs take 30-60s+; gunicorn's default 30s worker timeout
    # kills them mid-request (502). Threads let one worker serve other
    # requests while a search is in flight.
    startCommand: gunicorn app:app --timeout 300 --workers 1 --threads 8
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Shared secret: requests need ?key=<value> once (then cookied).
      # Without this, anyone who finds the URL spends your API credits.
      - key: GERP_PASSWORD
        sync: false
